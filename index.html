<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FixMitra - Mitra Registration</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <header>

        <h1>FixMitra</h1>

        <p>Local Services, Made Easy</p>

    </header>



    <main>

        <section class="registration-box">

            <h2>Join as a Mitra</h2>

            <p>
                Register your shop or service business
                with FixMitra.
            </p>


            <form id="mitraForm">


                <!-- OWNER NAME -->

                <label>
                    Owner Name
                </label>

                <input
                    type="text"
                    id="ownerName"
                    placeholder="Enter owner name"
                    required>



                <!-- BUSINESS NAME -->

                <label>
                    Business / Shop Name
                </label>

                <input
                    type="text"
                    id="businessName"
                    placeholder="Enter shop name"
                    required>



                <!-- MOBILE -->

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    required>


                <button
                    type="button"
                    onclick="sendMobileOTP()">

                    Send Mobile OTP

                </button>



                <!-- MOBILE OTP -->

                <label>
                    Mobile Verification OTP
                </label>

                <input
                    type="text"
                    id="mobileOTP"
                    placeholder="Enter OTP"
                    maxlength="6"
                    required>


                <button
                    type="button"
                    onclick="verifyMobileOTP()">

                    Verify Mobile

                </button>



                <!-- EMAIL -->

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    required>


                <button
                    type="button"
                    onclick="sendEmailOTP()">

                    Send Email Verification

                </button>



                <!-- EMAIL OTP -->

                <label>
                    Email Verification OTP
                </label>

                <input
                    type="text"
                    id="emailOTP"
                    placeholder="Enter email OTP"
                    maxlength="6"
                    required>


                <button
                    type="button"
                    onclick="verifyEmailOTP()">

                    Verify Email

                </button>



                <!-- SERVICE -->

                <label>
                    Service
                </label>

                <select
                    id="service"
                    required>

                    <option value="">
                        Select Service
                    </option>

                    <option>
                        Electrician
                    </option>

                    <option>
                        Plumber
                    </option>

                    <option>
                        AC Repair
                    </option>

                    <option>
                        RO Service
                    </option>

                    <option>
                        Carpenter
                    </option>

                    <option>
                        Cleaning
                    </option>

                    <option>
                        Home Repair
                    </option>

                    <option>
                        Computer Repair
                    </option>

                    <option>
                        Appliance Repair
                    </option>

                    <option>
                        Painter
                    </option>

                    <option>
                        Other
                    </option>

                </select>



                <!-- LOCATION -->

                <label>
                    Location
                </label>

                <select
                    id="location"
                    required>

                    <option value="">
                        Select Location
                    </option>

                    <option>
                        Gurugram
                    </option>

                    <option>
                        Delhi
                    </option>

                    <option>
                        Noida
                    </option>

                    <option>
                        Faridabad
                    </option>

                </select>



                <!-- ADDRESS -->

                <label>
                    Full Address
                </label>

                <textarea
                    id="address"
                    rows="3"
                    placeholder="Enter complete shop address"
                    required></textarea>



                <!-- EXPERIENCE -->

                <label>
                    Experience
                </label>

                <select
                    id="experience"
                    required>

                    <option value="">
                        Select Experience
                    </option>

                    <option>
                        Less than 1 year
                    </option>

                    <option>
                        1-3 years
                    </option>

                    <option>
                        3-5 years
                    </option>

                    <option>
                        5-10 years
                    </option>

                    <option>
                        10+ years
                    </option>

                </select>



                <!-- SHOP PHOTO -->

                <label>
                    Shop Photo
                </label>

                <input
                    type="file"
                    id="shopPhoto"
                    accept="image/*"
                    required>



                <!-- PASSWORD -->

                <label>
                    Create Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    minlength="6"
                    required>



                <!-- TERMS -->

                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required>

                    I agree to FixMitra
                    terms and conditions.

                </label>



                <!-- REGISTER -->

                <button
                    type="submit"
                    class="register-button">

                    Register as Mitra

                </button>


            </form>

        </section>

    </main>



    <footer>

        <p>
            © 2026 FixMitra
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
